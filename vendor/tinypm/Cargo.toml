[package]
name = "tinypm"
version = "0.8.1-alpha"
edition = "2024"
rust-version = "1.85"
description = "One friendly package command for Linux"
license = "GPL-3.0-only"
repository = "https://github.com/AnimatedGTVR/TinyPM"
include = [
    "/Cargo.toml",
    "/Cargo.lock",
    "/src/*.rs",
    "/src/bin/*.rs",
    "/src/share/tinypm/aliases.tsv",
    "/src/share/tinypm/assets/TinyLogo.png",
    "/tests/*.rs",
    "/README.md",
    "/CHANGELOG.md",
    "/CONTRIBUTING.md",
    "/LICENSE",
    "/docs/**",
]

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive", "env"] }
clap_complete = "4.5"
libc = "0.2"
indicatif = "0.18"
fs2 = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.18", features = ["v4"] }

[dev-dependencies]
tempfile = "3.20"

[profile.release]
lto = "thin"
strip = true
