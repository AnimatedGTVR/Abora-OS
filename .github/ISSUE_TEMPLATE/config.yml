# Blank issues stay enabled on purpose. `abora bug-report --github --web`
# (see create_github_issue in scripts/core/abora.sh) opens a pre-filled
# /issues/new?body=... URL. With blank issues disabled GitHub redirects that
# to the template chooser and drops the pre-filled body, which would silently
# break that command for anyone reporting a bug from their own machine.
blank_issues_enabled: true

contact_links:
  - name: Security vulnerability
    url: https://github.com/AnimatedGTVR/Abora-OS/blob/edge/SECURITY.md
    about: Do not open a public issue for a security problem. Follow the disclosure process here.

  - name: Installation and recovery guides
    url: https://github.com/AnimatedGTVR/Abora-OS/blob/edge/docs/wiki/Home.md
    about: Install steps, recovery, updating, gaming, and the ANIX config layer.

  - name: FAQ
    url: https://github.com/AnimatedGTVR/Abora-OS/blob/edge/docs/wiki/FAQ.md
    about: Check here before filing — common questions are already answered.
