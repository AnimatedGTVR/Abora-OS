name: Tool Tests

# The Rust tools ship real unit tests that nothing else in CI runs:
# flake-check.yml covers shell scripts and Nix evaluation, and
# `nix flake check --no-build` does not build these derivations.

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  push:
  pull_request:

jobs:
  rust-tools:
    name: Rust tools (${{ matrix.tool }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tool: [abora-installer, abora-plan-tool]
    defaults:
      run:
        working-directory: tools/${{ matrix.tool }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # These jobs run test code from the pull request branch. Checkout
          # otherwise leaves the job's token in .git/config, where that code
          # could read it. Nothing here talks to git after checkout.
          persist-credentials: false

      - name: Show toolchain
        run: |
          set -euxo pipefail
          cargo --version
          rustc --version

      - name: Formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Tests
        run: cargo test --all-targets --locked

  python-syntax:
    name: Python GUI syntax
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # These jobs run test code from the pull request branch. Checkout
          # otherwise leaves the job's token in .git/config, where that code
          # could read it. Nothing here talks to git after checkout.
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Byte-compile the GTK front-ends
        # These import gi/Adw at runtime, which is not available on a bare
        # runner, so this checks syntax only -- enough to catch the kind of
        # edit that would crash the app the moment a user opened it.
        run: |
          set -euxo pipefail
          find scripts -name '*.py' -print0 | xargs -0 -r python -m py_compile
